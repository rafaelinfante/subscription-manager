services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: subscription_manager
      MYSQL_USER: subuser
      MYSQL_PASSWORD: subpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/subscription_manager?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: subuser
      SPRING_DATASOURCE_PASSWORD: subpass
      APP_FRONTEND_BASE_URL: http://localhost:8088
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8088
      # Retry immediately in the demo so "Run billing now" walks the whole dunning cycle;
      # production would use the 1/3/5-day default.
      APP_BILLING_RETRY_BACKOFF_DAYS: "0,0,0"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
