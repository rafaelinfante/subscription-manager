spring:
  application:
    name: subscription-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/subscription_manager?serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:subuser}
    password: ${SPRING_DATASOURCE_PASSWORD:subpass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  forward-headers-strategy: framework

app:
  jwt:
    issuer: subscription-manager
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    # Optional RSA keypair (PEM). When unset, an ephemeral keypair is generated at startup.
    rsa-public-key: ${APP_JWT_RSA_PUBLIC_KEY:}
    rsa-private-key: ${APP_JWT_RSA_PRIVATE_KEY:}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:4200}
    oauth2-redirect-path: /auth/oauth2-callback
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  payment:
    # token: decided by the subscription's payment method (tok_visa ok, tok_declined fails)
    mock-mode: ${APP_PAYMENT_MOCK_MODE:token}
  billing:
    # Days to wait before each dunning retry; the count is also the retry limit.
    retry-backoff-days: ${APP_BILLING_RETRY_BACKOFF_DAYS:1,3,5}
  security:
    # Send the refresh cookie only over HTTPS. Keep false for local http; set true behind TLS.
    cookie-secure: ${APP_COOKIE_SECURE:false}
  oauth2:
    google:
      client-id: ${OAUTH2_GOOGLE_CLIENT_ID:}
      client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${OAUTH2_GITHUB_CLIENT_ID:}
      client-secret: ${OAUTH2_GITHUB_CLIENT_SECRET:}
    facebook:
      client-id: ${OAUTH2_FACEBOOK_CLIENT_ID:}
      client-secret: ${OAUTH2_FACEBOOK_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    git:
      mode: simple

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
